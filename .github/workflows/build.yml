name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NuGetDirectory: ${{ github.workspace }}/nuget
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux x64 leg installs Mesa's software Vulkan driver, so the Vulkan device, surface pool
          # and transfer tests run there. Each platform's surface code runs on its own leg, so coverage
          # is gated once the legs are merged (the coverage job below).
          - { os: ubuntu-26.04, rid: linux-x64, filter: "TestCategory!=RequiresGpu", format: true }
          - { os: ubuntu-26.04-arm, rid: linux-arm64, filter: "TestCategory!=RequiresGpu&TestCategory!=RequiresVulkan", format: false }
          - { os: windows-latest, rid: win-x64, filter: "TestCategory!=RequiresGpu&TestCategory!=RequiresVulkan", format: false }
          # macOS runners are Apple-silicon VMs; VideoToolbox is tried there too.
          - { os: macos-26, rid: osx-arm64, filter: "TestCategory!=RequiresNvidia&TestCategory!=RequiresAmf&TestCategory!=RequiresVaapi&TestCategory!=RequiresVulkan", format: false }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # BtbN's Linux builds reach VA-API through a stub that aborts the process when libva is missing,
      # even for tests that never open a device. lavapipe is the software Vulkan the Vulkan tests use.
      - name: Install libva and a software Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libva2 libva-drm2 libvulkan1 mesa-vulkan-drivers

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Fetch the pinned FFmpeg build
        shell: pwsh
        run: ./eng/fetch-ffmpeg.ps1 -Rid ${{ matrix.rid }}

      - name: Restore
        run: dotnet restore FFmpeg.Interop.slnx

      - name: Check formatting
        if: matrix.format
        run: |
          # Sequential: the .NET 11 RC1 SDK's parallel tool restore attaches one package's commands to
          # another and fails the restore.
          dotnet tool restore --disable-parallel
          dotnet csharpier check .

      - name: Build
        run: dotnet build FFmpeg.Interop.slnx --no-restore -c Release

      - name: Test
        run: >-
          dotnet test --solution FFmpeg.Interop.slnx --no-build -c Release --settings tests.runsettings
          --filter "${{ matrix.filter }}"
          --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.rid }}
          if-no-files-found: warn
          path: "**/coverage.cobertura.xml"

      # IsAotCompatible only runs the analyzers. Publishing and running a real program is what proves
      # the bindings and the managed layer compile and work as Native AOT.
      - name: Native AOT publish and run
        shell: pwsh
        run: |
          dotnet publish samples/FFmpeg.Interop.Smoke/FFmpeg.Interop.Smoke.csproj -r ${{ matrix.rid }} -c Release -o artifacts/smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $libraries = if ($IsWindows) { 'native/${{ matrix.rid }}/bin' } else { 'native/${{ matrix.rid }}/lib' }
          $binary = if ($IsWindows) { 'artifacts/smoke/FFmpeg.Interop.Smoke.exe' } else { 'artifacts/smoke/FFmpeg.Interop.Smoke' }
          & $binary (Resolve-Path $libraries)
          exit $LASTEXITCODE

  coverage:
    name: Coverage (all legs merged)
    # Every platform runs code the others cannot (D3D surfaces on Windows, VA-API and Vulkan on Linux,
    # VideoToolbox on macOS), so the figure that means anything is the union. The GPU-only paths are
    # covered by the hardware suites run on the machines that have the GPUs; see CONTRIBUTING.md.
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Merge and gate
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem coverage -Recurse -Filter '*.cobertura.xml' | ForEach-Object FullName)
          $totals = ./eng/merge-coverage.ps1 -Reports $reports -Output merged.cobertura.xml
          @(
            '### Coverage, all CI legs merged'
            ''
            'Hand-written code only; the generated bindings are excluded. GPU paths are covered by `eng/test-machine.ps1` on the GPU machines.'
            ''
            '| Metric | Covered | Total | Rate |'
            '| --- | ---: | ---: | ---: |'
            "| Lines | $($totals.LinesCovered) | $($totals.LinesValid) | $($totals.Lines.ToString('P1')) |"
            "| Branches | $($totals.BranchesCovered) | $($totals.BranchesValid) | $($totals.Branches.ToString('P1')) |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($totals.Lines -lt 0.90 -or $totals.Branches -lt 0.80) {
            Write-Output "::error::Merged coverage $($totals.Lines.ToString('P1')) lines / $($totals.Branches.ToString('P1')) branches is below the 90% / 80% floor."
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: merged.cobertura.xml

  generated:
    name: Generated bindings are current
    # The bindings are generated on Windows (the D3D11 pass needs the Windows SDK headers) from pinned
    # header archives, so regenerating here must reproduce the committed files exactly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install LLVM 22 (clang builtin headers matching libclang)
        run: choco install llvm --version 22.1.8 -y --no-progress

      - name: Regenerate
        run: |
          dotnet tool restore --disable-parallel
          dotnet run generate/Generate.cs

      - name: Compare with the committed bindings
        shell: bash
        run: |
          if ! git diff --quiet -- src/FFmpeg.Interop/Generated tests/FFmpeg.Interop.Tests/Generated \
            || [ -n "$(git status --porcelain -- src/FFmpeg.Interop/Generated tests/FFmpeg.Interop.Tests/Generated)" ]; then
            echo "::error::The committed bindings differ from what generate/Generate.cs produces. Regenerate and commit."
            git status --short -- src/FFmpeg.Interop/Generated tests/FFmpeg.Interop.Tests/Generated | head -50
            exit 1
          fi

  pack:
    name: Pack
    needs: [test, generated]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Pack
        run: dotnet pack src/FFmpeg.Interop/FFmpeg.Interop.csproj -c Release -o ${{ env.NuGetDirectory }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.NuGetDirectory }}/*.nupkg

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.NuGetDirectory }}/*.nupkg

  publish:
    name: Publish to NuGet
    needs: [pack]
    # Only a published GitHub release publishes; a tag push alone builds and packs.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/FFmpeg.Interop
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ${{ env.NuGetDirectory }}

      - uses: actions/setup-dotnet@v6

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Agash

      - name: Push
        run: >-
          dotnet nuget push "${{ env.NuGetDirectory }}/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
